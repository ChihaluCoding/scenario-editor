name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v6

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v6

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 品質チェック
        run: |
          npm run lint
          npm test

      - name: 静的ファイルをビルド
        run: npm run build

      - name: Pages Artifactをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v5
